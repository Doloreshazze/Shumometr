name: Android release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Verify and build
        run: ./gradlew --no-daemon test lintRelease bundleRelease assembleRelease
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: shumometr-arm64-unsigned
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: shumometr-aab-unsigned
          if-no-files-found: error
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: shumometr-lint-report
          if-no-files-found: error
          path: app/build/reports/lint-results-release.html
